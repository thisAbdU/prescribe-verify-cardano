name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
         - name: Install Aiken
           run: |
             AIKEN_VERSION="1.1.19"
             curl -L -f -o aiken.tar.gz "https://github.com/aiken-lang/aiken/releases/download/v${AIKEN_VERSION}/aiken-x86_64-unknown-linux-gnu.tar.gz"
             tar -xzf aiken.tar.gz
             sudo mv aiken /usr/local/bin/
             chmod +x /usr/local/bin/aiken
             rm aiken.tar.gz
             aiken --version
         - run: pnpm install --frozen-lockfile
         - run: cd packages/onchain-scripts && ./scripts/compile.sh
         - run: pnpm build
