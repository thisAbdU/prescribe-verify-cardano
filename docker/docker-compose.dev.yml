version: '3.8'

services:
  # Supabase Local Development (optional)
  # Uncomment if you want to run Supabase locally
  # supabase:
  #   image: supabase/supabase:latest
  #   ports:
  #     - "54321:54321"  # API
  #     - "54322:54322"  # DB
  #   environment:
  #     POSTGRES_PASSWORD: postgres
  #     JWT_SECRET: your-super-secret-jwt-token
  #   volumes:
  #     - supabase_data:/var/lib/postgresql/data

  # Local Cardano Node (optional, for local development)
  # Uncomment if you want to run a local Cardano node
  # This requires significant resources and setup
  # cardano-node:
  #   image: inputoutput/cardano-node:latest
  #   volumes:
  #     - cardano_data:/data
  #     - ./cardano-node/config:/config
  #   command:
  #     - run
  #     - --config
  #     - /config/testnet-config.json
  #     - --database-path
  #     - /data/db
  #     - --socket-path
  #     - /data/node.socket
  #   environment:
  #     CARDANO_NETWORK: testnet
  #   ports:
  #     - "3001:3001"  # Cardano node port

  # Mock Blockfrost Service (optional, for local testing)
  # Uncomment if you want to mock Blockfrost API locally
  # mock-blockfrost:
  #   image: your-mock-blockfrost-image
  #   ports:
  #     - "8080:8080"
  #   environment:
  #     MOCK_NETWORK: testnet

  # Indexer Service
  indexer:
    build:
      context: ..
      dockerfile: services/indexer/Dockerfile
    environment:
      - NODE_ENV=development
      - BLOCKFROST_PROJECT_ID=${BLOCKFROST_PROJECT_ID}
      - CARDANO_NETWORK=${CARDANO_NETWORK:-testnet}
      - PRESCRIPTION_VALIDATOR_SCRIPT_ADDRESS=${PRESCRIPTION_VALIDATOR_SCRIPT_ADDRESS}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - POLL_INTERVAL_MS=${POLL_INTERVAL_MS:-30000}
    volumes:
      - ../services/indexer:/app
      - ../apps/web/lib/cardano:/app/lib/cardano
    working_dir: /app
    command: pnpm dev
    restart: unless-stopped
    depends_on:
      - supabase

  # Notifications Service
  notifications:
    build:
      context: ..
      dockerfile: services/notifications/Dockerfile
    environment:
      - NODE_ENV=development
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - TWILIO_SID=${TWILIO_SID}
      - TWILIO_TOKEN=${TWILIO_TOKEN}
      - TWILIO_FROM=${TWILIO_FROM}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
      - EMAIL_FROM=${EMAIL_FROM}
      - POLL_INTERVAL_MS=${POLL_INTERVAL_MS:-10000}
    volumes:
      - ../services/notifications:/app
    working_dir: /app
    command: pnpm dev
    restart: unless-stopped
    depends_on:
      - supabase

volumes:
  supabase_data:
  cardano_data:

# Usage:
# 1. Copy .env.example to .env and fill in your values
# 2. Run: docker-compose -f docker/docker-compose.dev.yml up -d
# 3. Or run services individually: pnpm dev:indexer, pnpm dev:notifications

